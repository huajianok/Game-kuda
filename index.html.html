<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Balapan Kuda Matematika</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body, html {
            position: fixed;
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .upside-down {
            transform: rotate(180deg);
        }
        .horse-track {
            transition: left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes horseGallop {
            0% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-6px) rotate(-8deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(-4px) rotate(8deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        .gallop {
            animation: horseGallop 0.4s ease-in-out;
        }
        .checkered {
            background-image: repeating-conic-gradient(#000 0 90deg, #fff 0 180deg) 0 0/14px 14px;
        }
    </style>
</head>
<body class="flex justify-center items-center h-full w-full">

    <div class="w-full max-w-md h-full flex flex-col justify-between bg-slate-900 shadow-2xl relative overflow-hidden">

        <!-- ================= PLAYER 1 (TOP - ROTATED 180 DEG) ================= -->
        <div class="upside-down flex-1 flex flex-col justify-between p-2 sm:p-3 bg-slate-50 border-b-4 border-blue-500 relative">
            
            <!-- Header, Mode Toggle & Score -->
            <div class="flex flex-col gap-1">
                <div class="flex justify-between items-center text-xs">
                    <div class="flex items-center gap-1">
                        <span class="bg-blue-600 text-white font-black px-2 py-0.5 rounded-full text-xs">KUDA 1</span>
                        <!-- Operator Toggle -->
                        <div class="flex bg-slate-200 rounded-lg p-0.5 border border-slate-300">
                            <button id="p1-op-mult" onclick="setOperator(1, 'x')" class="px-2 py-0.5 text-xs font-black rounded-md bg-blue-600 text-white shadow">×</button>
                            <button id="p1-op-div" onclick="setOperator(1, ':')" class="px-2 py-0.5 text-xs font-black rounded-md text-slate-600">:</button>
                        </div>
                    </div>
                    <span id="p1-score" class="text-blue-600 font-black text-sm">0 / 5</span>
                </div>
                
                <!-- Question Box & Input Display -->
                <div class="grid grid-cols-3 gap-2 items-center mt-0.5">
                    <div class="col-span-2 bg-blue-600 text-white rounded-xl py-2 px-2 text-center font-black text-2xl shadow-md tracking-wider flex items-center justify-center gap-2" id="p1-question">
                        6 × 3
                    </div>
                    <div id="p1-input" class="col-span-1 h-11 bg-white border-2 border-blue-400 rounded-xl text-center text-2xl font-black text-blue-900 flex items-center justify-center shadow-inner">
                    </div>
                </div>
            </div>

            <!-- SEPARATE TRACK FOR PLAYER 1 -->
            <div class="my-1 h-16 bg-emerald-600 rounded-xl relative border-2 border-emerald-700 overflow-hidden shadow-inner flex items-center">
                <div class="absolute left-10 top-0 bottom-0 w-1 border-r-2 border-dashed border-white/80 z-10"></div>
                <div class="absolute right-0 top-0 bottom-0 w-6 checkered z-10 border-l border-white/60"></div>
                
                <div id="horse1" class="horse-track absolute left-0 z-20 flex items-center">
                    <div class="flex items-center bg-white/95 px-2 py-1 rounded-2xl shadow-lg border-2 border-blue-500">
                        <span class="text-xs bg-blue-600 text-white font-black w-5 h-5 rounded-full flex items-center justify-center mr-1">1</span>
                        <span id="horse1-icon" class="text-4xl leading-none filter drop-shadow">🐎</span>
                    </div>
                </div>
            </div>

            <!-- Keypad P1 -->
            <div class="grid grid-cols-3 gap-1">
                <button onclick="pressKey(1, '1')" class="bg-white border-2 border-slate-200 text-slate-800 font-extrabold text-xl py-1.5 rounded-xl active:bg-slate-200 active:scale-95 transition shadow-sm">1</button>
                <button onclick="pressKey(1, '2')" class="bg-white border-2 border-slate-200 text-slate-800 font-extrabold text-xl py-1.5 rounded-xl active:bg-slate-200 active:scale-95 transition shadow-sm">2</button>
                <button onclick="pressKey(1, '3')" class="bg-white border-2 border-slate-200 text-slate-800 font-extrabold text-xl py-1.5 rounded-xl active:bg-slate-200 active:scale-95 transition shadow-sm">3</button>
                <button onclick="pressKey(1, '4')" class="bg-white border-2 border-slate-200 text-slate-800 font-extrabold text-xl py-1.5 rounded-xl active:bg-slate-200 active:scale-95 transition shadow-sm">4</button>
                <button onclick="pressKey(1, '5')" class="bg-white border-2 border-slate-200 text-slate-800 font-extrabold text-xl py-1.5 rounded-xl active:bg-slate-200 active:scale-95 transition shadow-sm">5</button>
                <button onclick="pressKey(1, '6')" class="bg-white border-2 border-slate-200 text-slate-800 font-extrabold text-xl py-1.5 rounded-xl active:bg-slate-200 active:scale-95 transition shadow-sm">6</button>
                <button onclick="pressKey(1, '7')" class="bg-white border-2 border-slate-200 text-slate-800 font-extrabold text-xl py-1.5 rounded-xl active:bg-slate-200 active:scale-95 transition shadow-sm">7</button>
                <button onclick="pressKey(1, '8')" class="bg-white border-2 border-slate-200 text-slate-800 font-extrabold text-xl py-1.5 rounded-xl active:bg-slate-200 active:scale-95 transition shadow-sm">8</button>
                <button onclick="pressKey(1, '9')" class="bg-white border-2 border-slate-200 text-slate-800 font-extrabold text-xl py-1.5 rounded-xl active:bg-slate-200 active:scale-95 transition shadow-sm">9</button>
                <button onclick="pressKey(1, 'C')" class="bg-rose-500 text-white font-black text-xl py-1.5 rounded-xl active:bg-rose-600 active:scale-95 transition shadow-sm">C</button>
                <button onclick="pressKey(1, '0')" class="bg-white border-2 border-slate-200 text-slate-800 font-extrabold text-xl py-1.5 rounded-xl active:bg-slate-200 active:scale-95 transition shadow-sm">0</button>
                <button onclick="pressKey(1, 'GO')" class="bg-emerald-500 text-white font-black text-xl py-1.5 rounded-xl active:bg-emerald-600 active:scale-95 transition shadow-sm">Go</button>
            </div>
        </div>

        <!-- ================= PLAYER 2 (BOTTOM - NORMAL) ================= -->
        <div class="flex-1 flex flex-col justify-between p-2 sm:p-3 bg-slate-50 border-t-4 border-red-500 relative">
            
            <!-- SEPARATE TRACK FOR PLAYER 2 -->
            <div class="my-1 h-16 bg-emerald-600 rounded-xl relative border-2 border-emerald-700 overflow-hidden shadow-inner flex items-center">
                <div class="absolute left-10 top-0 bottom-0 w-1 border-r-2 border-dashed border-white/80 z-10"></div>
                <div class="absolute right-0 top-0 bottom-0 w-6 checkered z-10 border-l border-white/60"></div>
                
                <div id="horse2" class="horse-track absolute left-0 z-20 flex items-center">
                    <div class="flex items-center bg-white/95 px-2 py-1 rounded-2xl shadow-lg border-2 border-red-500">
                        <span class="text-xs bg-red-600 text-white font-black w-5 h-5 rounded-full flex items-center justify-center mr-1">2</span>
                        <span id="horse2-icon" class="text-4xl leading-none filter drop-shadow">🐎</span>
                    </div>
                </div>
            </div>

            <!-- Header, Mode Toggle & Score -->
            <div class="flex flex-col gap-1">
                <div class="flex justify-between items-center text-xs">
                    <div class="flex items-center gap-1">
                        <span class="bg-red-600 text-white font-black px-2 py-0.5 rounded-full text-xs">KUDA 2</span>
                        <!-- Operator Toggle -->
                        <div class="flex bg-slate-200 rounded-lg p-0.5 border border-slate-300">
                            <button id="p2-op-mult" onclick="setOperator(2, 'x')" class="px-2 py-0.5 text-xs font-black rounded-md bg-red-600 text-white shadow">×</button>
                            <button id="p2-op-div" onclick="setOperator(2, ':')" class="px-2 py-0.5 text-xs font-black rounded-md text-slate-600">:</button>
                        </div>
                    </div>
                    <span id="p2-score" class="text-red-600 font-black text-sm">0 / 5</span>
                </div>
                
                <!-- Question Box & Input Display -->
                <div class="grid grid-cols-3 gap-2 items-center mt-0.5">
                    <div class="col-span-2 bg-red-600 text-white rounded-xl py-2 px-2 text-center font-black text-2xl shadow-md tracking-wider flex items-center justify-center gap-2" id="p2-question">
                        8 × 3
                    </div>
                    <div id="p2-input" class="col-span-1 h-11 bg-white border-2 border-red-400 rounded-xl text-center text-2xl font-black text-red-900 flex items-center justify-center shadow-inner">
                    </div>
                </div>
            </div>

            <!-- Keypad P2 -->
            <div class="grid grid-cols-3 gap-1">
                <button onclick="pressKey(2, '1')" class="bg-white border-2 border-slate-200 text-slate-800 font-extrabold text-xl py-1.5 rounded-xl active:bg-slate-200 active:scale-95 transition shadow-sm">1</button>
                <button onclick="pressKey(2, '2')" class="bg-white border-2 border-slate-200 text-slate-800 font-extrabold text-xl py-1.5 rounded-xl active:bg-slate-200 active:scale-95 transition shadow-sm">2</button>
                <button onclick="pressKey(2, '3')" class="bg-white border-2 border-slate-200 text-slate-800 font-extrabold text-xl py-1.5 rounded-xl active:bg-slate-200 active:scale-95 transition shadow-sm">3</button>
                <button onclick="pressKey(2, '4')" class="bg-white border-2 border-slate-200 text-slate-800 font-extrabold text-xl py-1.5 rounded-xl active:bg-slate-200 active:scale-95 transition shadow-sm">4</button>
                <button onclick="pressKey(2, '5')" class="bg-white border-2 border-slate-200 text-slate-800 font-extrabold text-xl py-1.5 rounded-xl active:bg-slate-200 active:scale-95 transition shadow-sm">5</button>
                <button onclick="pressKey(2, '6')" class="bg-white border-2 border-slate-200 text-slate-800 font-extrabold text-xl py-1.5 rounded-xl active:bg-slate-200 active:scale-95 transition shadow-sm">6</button>
                <button onclick="pressKey(2, '7')" class="bg-white border-2 border-slate-200 text-slate-800 font-extrabold text-xl py-1.5 rounded-xl active:bg-slate-200 active:scale-95 transition shadow-sm">7</button>
                <button onclick="pressKey(2, '8')" class="bg-white border-2 border-slate-200 text-slate-800 font-extrabold text-xl py-1.5 rounded-xl active:bg-slate-200 active:scale-95 transition shadow-sm">8</button>
                <button onclick="pressKey(2, '9')" class="bg-white border-2 border-slate-200 text-slate-800 font-extrabold text-xl py-1.5 rounded-xl active:bg-slate-200 active:scale-95 transition shadow-sm">9</button>
                <button onclick="pressKey(2, 'C')" class="bg-rose-500 text-white font-black text-xl py-1.5 rounded-xl active:bg-rose-600 active:scale-95 transition shadow-sm">C</button>
                <button onclick="pressKey(2, '0')" class="bg-white border-2 border-slate-200 text-slate-800 font-extrabold text-xl py-1.5 rounded-xl active:bg-slate-200 active:scale-95 transition shadow-sm">0</button>
                <button onclick="pressKey(2, 'GO')" class="bg-emerald-500 text-white font-black text-xl py-1.5 rounded-xl active:bg-emerald-600 active:scale-95 transition shadow-sm">Go</button>
            </div>
        </div>

        <!-- Victory Modal Overlay -->
        <div id="win-modal" class="hidden absolute inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-xs rounded-3xl p-6 text-center shadow-2xl border-4 border-yellow-400 transform scale-100 transition-all">
                <div class="text-6xl mb-3 animate-bounce">🏆</div>
                <h2 id="win-text" class="text-2xl font-black mb-1">KUDA 1 MENANG!</h2>
                <p class="text-xs text-slate-500 font-bold mb-6">Mencapai garis finish paling awal!</p>
                <button onclick="resetGame()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-3.5 rounded-2xl shadow-lg active:scale-95 transition text-lg tracking-wide">
                    MAIN LAGI 🔄
                </button>
            </div>
        </div>

    </div>

    <script>
        const WIN_STEPS = 5;
        let p1Score = 0, p2Score = 0;
        let p1Input = "", p2Input = "";
        let p1Op = "x", p2Op = "x";
        let p1Q = {}, p2Q = {};
        let gameOver = false;

        // Web Audio API Sound Effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq = 440, type = 'sine', duration = 0.1) {
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        // Generate Random Math Question (Multiplication or Division without decimal)
        function generateQuestion(op) {
            if (op === ':') {
                const answer = Math.floor(Math.random() * 9) + 1; // 1..9
                const divisor = Math.floor(Math.random() * 8) + 2; // 2..9
                const dividend = answer * divisor;
                return { a: dividend, b: divisor, ans: answer, symbol: ':' };
            } else {
                const a = Math.floor(Math.random() * 8) + 2; // 2..9
                const b = Math.floor(Math.random() * 9) + 1; // 1..9
                return { a, b, ans: a * b, symbol: '×' };
            }
        }

        function setOperator(player, op) {
            if (player === 1) {
                p1Op = op;
                p1Q = generateQuestion(p1Op);
                p1Input = "";
                document.getElementById('p1-op-mult').className = op === 'x' ? 'px-2 py-0.5 text-xs font-black rounded-md bg-blue-600 text-white shadow' : 'px-2 py-0.5 text-xs font-black rounded-md text-slate-600';
                document.getElementById('p1-op-div').className = op === ':' ? 'px-2 py-0.5 text-xs font-black rounded-md bg-blue-600 text-white shadow' : 'px-2 py-0.5 text-xs font-black rounded-md text-slate-600';
            } else {
                p2Op = op;
                p2Q = generateQuestion(p2Op);
                p2Input = "";
                document.getElementById('p2-op-mult').className = op === 'x' ? 'px-2 py-0.5 text-xs font-black rounded-md bg-red-600 text-white shadow' : 'px-2 py-0.5 text-xs font-black rounded-md text-slate-600';
                document.getElementById('p2-op-div').className = op === ':' ? 'px-2 py-0.5 text-xs font-black rounded-md bg-red-600 text-white shadow' : 'px-2 py-0.5 text-xs font-black rounded-md text-slate-600';
            }
            render();
        }

        function render() {
            document.getElementById('p1-question').innerText = `${p1Q.a} ${p1Q.symbol} ${p1Q.b}`;
            document.getElementById('p2-question').innerText = `${p2Q.a} ${p2Q.symbol} ${p2Q.b}`;
            
            document.getElementById('p1-input').innerText = p1Input;
            document.getElementById('p2-input').innerText = p2Input;

            document.getElementById('p1-score').innerText = `${p1Score} / ${WIN_STEPS}`;
            document.getElementById('p2-score').innerText = `${p2Score} / ${WIN_STEPS}`;
        }

        function pressKey(player, key) {
            if (gameOver) return;
            playBeep(600, 'triangle', 0.05);

            if (player === 1) {
                if (key === 'C') p1Input = "";
                else if (key === 'GO') checkAnswer(1);
                else if (p1Input.length < 3) p1Input += key;
            } else {
                if (key === 'C') p2Input = "";
                else if (key === 'GO') checkAnswer(2);
                else if (p2Input.length < 3) p2Input += key;
            }
            render();
        }

        function checkAnswer(player) {
            if (player === 1) {
                if (parseInt(p1Input) === p1Q.ans) {
                    playBeep(880, 'sine', 0.15);
                    p1Score++;
                    moveHorse(1, p1Score);
                    p1Q = generateQuestion(p1Op);
                    if (p1Score >= WIN_STEPS) win(1);
                } else {
                    playBeep(220, 'sawtooth', 0.2);
                }
                p1Input = "";
            } else {
                if (parseInt(p2Input) === p2Q.ans) {
                    playBeep(880, 'sine', 0.15);
                    p2Score++;
                    moveHorse(2, p2Score);
                    p2Q = generateQuestion(p2Op);
                    if (p2Score >= WIN_STEPS) win(2);
                } else {
                    playBeep(220, 'sawtooth', 0.2);
                }
                p2Input = "";
            }
            render();
        }

        function moveHorse(player, score) {
            const horse = document.getElementById(`horse${player}`);
            const horseIcon = document.getElementById(`horse${player}-icon`);
            const min = 0;  // Start position %
            const max = 70; // Finish line position %

            const pos = min + (score / WIN_STEPS) * (max - min);
            horse.style.left = `${pos}%`;

            // Trigger gallop bounce animation
            horseIcon.classList.remove('gallop');
            void horseIcon.offsetWidth; // Force reflow
            horseIcon.classList.add('gallop');
        }

        function win(player) {
            gameOver = true;
            playBeep(523, 'sine', 0.2);
            setTimeout(() => playBeep(659, 'sine', 0.2), 150);
            setTimeout(() => playBeep(783, 'sine', 0.3), 300);

            const modal = document.getElementById('win-modal');
            const winText = document.getElementById('win-text');
            winText.innerText = `KUDA ${player} MENANG! 🎉`;
            winText.className = player === 1 ? "text-2xl font-black mb-1 text-blue-600" : "text-2xl font-black mb-1 text-red-600";
            modal.classList.remove('hidden');
        }

        function resetGame() {
            p1Score = 0;
            p2Score = 0;
            p1Input = "";
            p2Input = "";
            gameOver = false;
            p1Q = generateQuestion(p1Op);
            p2Q = generateQuestion(p2Op);
            moveHorse(1, 0);
            moveHorse(2, 0);
            document.getElementById('win-modal').classList.add('hidden');
            render();
        }

        window.onload = function() {
            p1Q = generateQuestion(p1Op);
            p2Q = generateQuestion(p2Op);
            render();
        };
    </script>
</body>
</html>
